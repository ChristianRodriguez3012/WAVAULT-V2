<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Player</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div style="padding: 2rem;">
    <h1>Test Reproductor</h1>
    <button id="testBtn" style="padding: 1rem 2rem; background: #6366f1; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem;">
      🎵 Probar Reproductor
    </button>
    <div id="status" style="margin-top: 1rem; padding: 1rem; background: #f1f5f9; border-radius: 8px;"></div>
  </div>

  <!-- Reproductor Global -->
  <div id="globalPlayer" class="global-player" style="display: none;">
    <div class="player-container">
      <div class="player-info">
        <img id="playerCover" src="" alt="Cover" class="player-cover">
        <div class="player-track-info">
          <h4 id="playerTitle">-</h4>
          <p id="playerArtist">-</p>
        </div>
      </div>
      <div class="player-controls">
        <button id="playPauseBtn" class="player-btn">
          <i class="fas fa-play"></i>
        </button>
        <div class="player-progress">
          <span id="currentTime">0:00</span>
          <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
            <input type="range" id="progressSlider" min="0" max="100" value="0" class="progress-slider">
          </div>
          <span id="duration">0:00</span>
        </div>
        <button id="volumeBtn" class="player-btn">
          <i class="fas fa-volume-up"></i>
        </button>
        <input type="range" id="volumeSlider" min="0" max="100" value="80" class="volume-slider">
      </div>
    </div>
  </div>

  <script src="/assets/js/main.js"></script>
  <script>
    document.getElementById('testBtn').addEventListener('click', async () => {
      const statusDiv = document.getElementById('status');
      statusDiv.innerHTML = '📡 Cargando beat...';
      
      try {
        const response = await fetch('/beats');
        const beats = await response.json();
        
        if (beats.length > 0) {
          const testBeat = beats[0];
          statusDiv.innerHTML = `✅ Beat cargado: ${testBeat.title}<br>Audio: ${testBeat.audio}<br>Reproduciendo...`;
          
          // Llamar a playBeat
          playBeat(testBeat, null);
        } else {
          statusDiv.innerHTML = '❌ No hay beats disponibles';
        }
      } catch (error) {
        statusDiv.innerHTML = '❌ Error: ' + error.message;
      }
    });
  </script>
</body>
</html>
