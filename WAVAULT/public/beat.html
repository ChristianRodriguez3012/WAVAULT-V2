<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Beat - WAVAULT</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header>
    <h1>🎧 WAVAULT</h1>
    <nav>
      <a href="#" id="inicioLink">Inicio</a>
      <a href="/perfil.html?productor=" id="perfilLink">Perfil del Productor</a>
    </nav>
  </header>

  <main class="beat-detalle-container">
    <div id="detalleBeat">
      <p>Cargando beat...</p>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 WAVAULT. Todos los derechos reservados.</p>
  </footer>

  <!-- PLAYER GLOBAL -->
  <div class="player-wrapper">
    <div class="player-container">
      <div class="player-info">
        <img id="playerCover" src="/assets/img/placeholder.jpg" alt="Cover" class="player-cover">
        <div class="player-track-info">
          <h4 id="playerTitle">-</h4>
          <p id="playerArtist">-</p>
        </div>
      </div>
      <div class="player-controls">
        <button id="playPauseBtn" class="player-btn" title="Reproducir">
          <i class="fas fa-play"></i>
        </button>
        <div class="player-progress">
          <span id="currentTime" class="time-display">0:00</span>
          <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
            <input type="range" id="progressSlider" min="0" max="100" value="0" class="progress-slider">
          </div>
          <span id="duration" class="time-display">0:00</span>
        </div>
        <button id="volumeBtn" class="player-btn" title="Volumen">
          <i class="fas fa-volume-up"></i>
        </button>
        <input type="range" id="volumeSlider" min="0" max="100" value="80" class="volume-slider" title="Volumen">
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
  <script src="/js/player-global.js"></script>
  <script>
    const usuario = JSON.parse(localStorage.getItem("usuarioActivo"));
    const inicioLink = document.getElementById("inicioLink");

    if (usuario?.rol === "productor") {
      inicioLink.href = "/dashboard/producer.html";
    } else if (usuario?.rol === "cliente") {
      inicioLink.href = "/dashboard/client.html";
    } else {
      inicioLink.href = "/login.html";
    }

    async function cargarBeat() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) return;

      try {
        const res = await fetch(`/beats?id=${id}`);
        const data = await res.json();
        const beat = Array.isArray(data) ? data[0] : data;

        const contenedor = document.getElementById("detalleBeat");
        if (!beat) {
          contenedor.innerHTML = "<p>❌ Beat no encontrado.</p>";
          return;
        }

        const cover = beat.cover?.startsWith("uploads/") ? `/${beat.cover}` : "assets/img/placeholder.jpg";
        const audio = beat.audio?.startsWith("uploads/") ? `/${beat.audio}` : null;

        const puedeComprar = usuario?.rol === "cliente";
        const esProductor = usuario?.email === beat.producer;

        let botonCompra = "";
        if (!usuario) {
          botonCompra = `<button disabled style="background:#ccc; color:#666; cursor:not-allowed;">🔒 Inicia sesión para comprar</button>`;
        } else if (esProductor) {
          botonCompra = `<button disabled style="background:#ccc; color:#666; cursor:not-allowed;">🚫 No puedes comprar tu propio beat</button>`;
        } else if (puedeComprar) {
          botonCompra = `<button>🛒 Comprar este beat</button>`;
        }

        contenedor.innerHTML = `
          <div class="beat-detalle">
            <img src="${cover}" alt="${beat.title}" />
            <div class="info">
              <h2>${beat.title}</h2>
              <p>🎛️ ${beat.bpm} BPM • ${beat.key}</p>
              <p>👤 ${beat.producer}</p>
              <p>🏷️ ${beat.tags.split(',').map(t => `#${t.trim()}`).join(' ')}</p>
              <p><strong>$${beat.price}</strong></p>
              ${botonCompra}
            </div>
          </div>
        `;

        // Reproducir en el player global
        if (audio && window.wavaultPlayer) {
          const beatData = {
            id: beat.id,
            nombre: beat.title,
            productor: beat.producer,
            portada: cover,
            archivo: audio,
            precio: beat.price
          };
          window.wavaultPlayer.setBeat(beatData);
        }

        document.getElementById("perfilLink").href = `/perfil.html?productor=${encodeURIComponent(beat.producer)}`;
      } catch (err) {
        console.error("❌ Error al cargar beat:", err);
      }
    }

    cargarBeat();
  </script>

  <!-- PLAYER GLOBAL -->
  <div class="player-wrapper">
    <div class="player-container">
      <div class="player-info-row">
        <div class="player-info-content">
          <img id="playerCover" src="/assets/img/placeholder.jpg" alt="Cover" class="player-cover">
          <div class="player-track-details">
            <h3 id="playerTitle" class="player-title">Selecciona un beat</h3>
            <p id="playerArtist" class="player-artist">Productor</p>
            <p id="playerMeta" class="player-meta">- BPM • - KEY</p>
          </div>
        </div>
      </div>
      <div class="player-progress-row">
        <span id="currentTime" class="time-display">0:00</span>
        <div class="progress-bar-container">
          <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
            <input type="range" id="progressSlider" min="0" max="100" value="0" class="progress-slider">
          </div>
        </div>
        <span id="duration" class="time-display">0:00</span>
      </div>
      <div class="player-controls-row">
        <div class="player-buttons-group">
          <button id="prevBtn" class="player-btn" title="Beat anterior"><i class="fas fa-step-backward"></i></button>
          <button id="playPauseBtn" class="player-btn play-pause-btn" title="Reproducir"><i class="fas fa-play"></i></button>
          <button id="nextBtn" class="player-btn" title="Siguiente beat"><i class="fas fa-step-forward"></i></button>
        </div>
        <div class="spacer"></div>
        <div class="player-secondary-controls">
          <button id="loopBtn" class="player-btn secondary-btn" title="Modo repetición"><i class="fas fa-redo"></i></button>
          <button id="volumeBtn" class="player-btn secondary-btn" title="Volumen"><i class="fas fa-volume-up"></i></button>
          <input type="range" id="volumeSlider" min="0" max="100" value="80" class="volume-slider" title="Volumen">
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
  <script src="/js/player-global.js"></script>
  <script src="/js/beat-player-integration.js"></script>
</body>
</html>
