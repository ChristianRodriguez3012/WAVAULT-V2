<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cliente - WAVAULT</title>
  <base href="/" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />


  <style>
    .burbuja {
      background-color: red;
      color: white;
      font-weight: bold;
      padding: 2px 7px;
      border-radius: 50%;
      font-size: 0.75em;
      margin-left: 5px;
      vertical-align: middle;
    }

    .beat-card {
      border: 1px solid #ccc;
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
      box-shadow: 1px 1px 6px rgba(0,0,0,0.05);
    }

    .beat-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    .beat-info {
      padding: 10px;
    }

    .beat-info h3 {
      margin: 0 0 5px;
      color: #1a73e8;
      cursor: pointer;
    }

    .beat-info .nombre-prod {
      color: #1a73e8;
      cursor: pointer;
    }

    .historial-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    /* 🎧 Reproductor Global */
    .player-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      background-color: #111;
      color: white;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 999;
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player-info img {
      width: 50px;
      height: 50px;
      border-radius: 4px;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .player-controls input[type="range"] {
      height: 4px;
    }

    .player-timer {
      font-size: 0.85em;
    }
  </style>

  <script>
    window.usuario = JSON.parse(localStorage.getItem('usuarioActivo'));
    if (!usuario || usuario.rol !== 'cliente') {
      alert('Acceso denegado. Inicia sesión como cliente.');
      window.location.href = '../login.html';
    }
  </script>
</head>
<body>
  <header>
    <h1>🎧 WAVAULT</h1>
    <nav>
      <a href="#" data-seccion="feed">Feed</a>
      <a href="#" data-seccion="carrito">
        Carrito <span id="carritoContador" class="burbuja">0</span>
      </a>
      <a href="#" data-seccion="perfil">Mi Perfil</a>
      <a href="#" onclick="cerrarSesion()">Cerrar Sesión</a>
    </nav>
  </header>

  <main>
    <!-- ========== FEED ========== -->
    <section id="feedSection" class="cliente-section">
      <div class="search-bar">
        <input type="text" id="buscarBeatsCliente" placeholder="Buscar beats..." />
      </div>
      <div id="beatsCliente" class="beat-feed"></div>
    </section>

    <!-- ========== CARRITO ========== -->
    <section id="carritoSection" class="cliente-section" style="display:none;">
      <h2>🛒 Carrito</h2>
      <div id="carritoItems" class="carrito-list"></div>
      <p><strong>Total:</strong> $<span id="carritoTotal">0</span></p>
      <button onclick="pagar()">Pagar</button>
      <button onclick="vaciarCarrito()">Vaciar carrito</button>
    </section>

    <!-- ========== PERFIL ========== -->
    <section id="perfilSection" class="cliente-section" style="display:none;">
      <h2>👤 Mi Perfil</h2>
      <p><strong>Email:</strong> <span id="clienteEmail">-</span></p>
      <h3>🧾 Historial de Compras</h3>
      <div id="historialCompras" class="historial-grid"></div>
    </section>
  </main>

  <!-- ✅ Reproductor Global -->
  <div id="globalPlayer" class="global-player" style="display: none;">
    <div class="player-container">
      <div class="player-info">
        <img id="playerCover" src="" alt="Cover" class="player-cover">
        <div class="player-track-info">
          <h4 id="playerTitle">-</h4>
          <p id="playerArtist">-</p>
        </div>
      </div>
      <div class="player-controls">
        <button id="playPauseBtn" class="player-btn">
          <i class="fas fa-play"></i>
        </button>
        <div class="player-progress">
          <span id="currentTime">0:00</span>
          <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
            <input type="range" id="progressSlider" min="0" max="100" value="0" class="progress-slider">
          </div>
          <span id="duration">0:00</span>
        </div>
        <button id="volumeBtn" class="player-btn">
          <i class="fas fa-volume-up"></i>
        </button>
        <input type="range" id="volumeSlider" min="0" max="100" value="80" class="volume-slider">
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-content">
      <div class="footer-section">
        <h4>WAVAULT</h4>
        <p>Tu plataforma de beats de confianza</p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2025 WAVAULT. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="/assets/js/client.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.usuario) {
        document.getElementById("clienteEmail").textContent = usuario.email;
      }

      document.querySelectorAll("a[data-seccion]").forEach(link => {
        link.addEventListener("click", function (e) {
          e.preventDefault();
          const seccion = this.dataset.seccion;
          document.querySelectorAll(".cliente-section").forEach(s => s.style.display = "none");
          const seccionActiva = document.getElementById(seccion + "Section");
          if (seccionActiva) seccionActiva.style.display = "block";

          if (seccion === "carrito" && typeof renderizarCarrito === "function") renderizarCarrito();
          if (seccion === "perfil" && typeof renderizarHistorial === "function") renderizarHistorial();
        });
      });
      
      // Event listeners del reproductor
      if (document.getElementById('playPauseBtn')) {
        document.getElementById('playPauseBtn').addEventListener('click', togglePlayPause);
        document.getElementById('progressSlider').addEventListener('input', (e) => seekAudio(e.target.value));
        document.getElementById('volumeSlider').addEventListener('input', (e) => changeVolume(e.target.value));
        document.getElementById('volumeBtn').addEventListener('click', toggleMute);
      }
    });

    function cerrarSesion() {
      localStorage.removeItem('usuarioActivo');
      window.location.href = '/login.html';
    }
  </script>
</body>
</html>
