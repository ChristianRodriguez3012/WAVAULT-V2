<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cliente - WAVAULT</title>
  <base href="/" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <script>
    window.usuario = JSON.parse(localStorage.getItem('usuarioActivo'));
    if (!usuario || usuario.rol !== 'cliente') {
      alert('Acceso denegado. Inicia sesión como cliente.');
      window.location.href = '/login.html';
    }
  </script>
</head>
<body>
  <header class="navbar">
    <div class="navbar-container">
      <div class="logo">
        <i class="fas fa-compact-disc"></i>
        <span>WAVAULT</span>
      </div>
      <nav class="nav-links">
        <a href="#" data-seccion="feed" class="nav-link">Feed</a>
        <a href="#" data-seccion="carrito" class="nav-link">
          Carrito <span id="carritoContador" style="background: #ef4444; color: white; padding: 0.25rem 0.5rem; border-radius: 10px; font-size: 0.75rem; margin-left: 0.5rem;">0</span>
        </a>
        <a href="#" data-seccion="perfil" class="nav-link">Mi Perfil</a>
        <a href="#" onclick="cerrarSesion()" class="nav-link btn-register">Cerrar Sesión</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="feedSection" class="cliente-section" style="padding: 2rem;">
      <div class="search-bar" style="max-width: 1400px; margin: 0 auto 2rem;">
        <i class="fas fa-search"></i>
        <input type="text" id="buscarBeatsCliente" placeholder="Buscar beats..." />
      </div>
      <div id="beatsCliente" class="beat-feed"></div>
    </section>

    <section id="carritoSection" class="cliente-section" style="display:none; max-width: 1000px; margin: 0 auto; padding: 2rem;">
      <h2 style="margin-bottom: 2rem; color: #1e293b;"><i class="fas fa-shopping-cart"></i> Mi Carrito</h2>
      <div id="carritoItems" class="carrito-list"></div>
      <div style="background: white; padding: 2rem; border-radius: 12px; margin-top: 2rem; text-align: right;">
        <p style="margin: 0 0 1rem 0; font-size: 1.5rem;"><strong>Total:</strong> $<span id="carritoTotal">0</span></p>
        <button onclick="pagar()" style="padding: 1rem 2rem; background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-right: 1rem;">
          <i class="fas fa-credit-card"></i> Proceder al Pago
        </button>
        <button onclick="vaciarCarrito()" style="padding: 1rem 2rem; background: #ef4444; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">
          <i class="fas fa-trash"></i> Vaciar Carrito
        </button>
      </div>
    </section>

    <section id="perfilSection" class="cliente-section" style="display:none; max-width: 1000px; margin: 0 auto; padding: 2rem;">
      <h2 style="margin-bottom: 2rem; color: #1e293b;"><i class="fas fa-user"></i> Mi Perfil</h2>
      <div style="background: white; padding: 2rem; border-radius: 12px; margin-bottom: 2rem;">
        <p style="font-size: 1.1rem;"><strong>Email:</strong> <span id="clienteEmail">-</span></p>
      </div>
      <h3 style="margin-bottom: 1rem; color: #1e293b;"><i class="fas fa-history"></i> Historial de Compras</h3>
      <div id="historialCompras"></div>
    </section>
  </main>

  <div id="globalPlayer" class="global-player" style="display: none;">
    <div class="player-container">
      <div class="player-info">
        <img id="playerCover" src="" alt="Cover" class="player-cover">
        <div class="player-track-info">
          <h4 id="playerTitle">-</h4>
          <p id="playerArtist">-</p>
        </div>
      </div>
      <div class="player-controls">
        <button id="playPauseBtn" class="player-btn">
          <i class="fas fa-play"></i>
        </button>
        <div class="player-progress">
          <span id="currentTime">0:00</span>
          <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
            <input type="range" id="progressSlider" min="0" max="100" value="0" class="progress-slider">
          </div>
          <span id="duration">0:00</span>
        </div>
        <button id="volumeBtn" class="player-btn">
          <i class="fas fa-volume-up"></i>
        </button>
        <input type="range" id="volumeSlider" min="0" max="100" value="80" class="volume-slider">
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-content">
      <div class="footer-section">
        <h4>WAVAULT</h4>
        <p>Tu plataforma de beats de confianza</p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2025 WAVAULT. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="/assets/js/client.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.usuario) {
        document.getElementById("clienteEmail").textContent = usuario.email;
      }

      document.querySelectorAll("a[data-seccion]").forEach(link => {
        link.addEventListener("click", function (e) {
          e.preventDefault();
          const seccion = this.dataset.seccion;
          document.querySelectorAll(".cliente-section").forEach(s => s.style.display = "none");
          const seccionActiva = document.getElementById(seccion + "Section");
          if (seccionActiva) seccionActiva.style.display = "block";

          if (seccion === "carrito" && typeof renderizarCarrito === "function") renderizarCarrito();
          if (seccion === "perfil" && typeof renderizarHistorial === "function") renderizarHistorial();
        });
      });
    });

    function cerrarSesion() {
      localStorage.removeItem('usuarioActivo');
      window.location.href = '/login.html';
    }
  </script>

  <!-- PLAYER GLOBAL -->
  <div class="player-wrapper">
    <div class="player-container">
      <div class="player-info-row">
        <div class="player-info-content">
          <img id="playerCover" src="/assets/img/placeholder.jpg" alt="Cover" class="player-cover">
          <div class="player-track-details">
            <h3 id="playerTitle" class="player-title">Selecciona un beat</h3>
            <p id="playerArtist" class="player-artist">Productor</p>
            <p id="playerMeta" class="player-meta">- BPM • - KEY</p>
          </div>
        </div>
      </div>
      <div class="player-progress-row">
        <span id="currentTime" class="time-display">0:00</span>
        <div class="progress-bar-container">
          <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
            <input type="range" id="progressSlider" min="0" max="100" value="0" class="progress-slider">
          </div>
        </div>
        <span id="duration" class="time-display">0:00</span>
      </div>
      <div class="player-controls-row">
        <div class="player-buttons-group">
          <button id="prevBtn" class="player-btn" title="Beat anterior"><i class="fas fa-step-backward"></i></button>
          <button id="playPauseBtn" class="player-btn play-pause-btn" title="Reproducir"><i class="fas fa-play"></i></button>
          <button id="nextBtn" class="player-btn" title="Siguiente beat"><i class="fas fa-step-forward"></i></button>
        </div>
        <div class="spacer"></div>
        <div class="player-secondary-controls">
          <button id="loopBtn" class="player-btn secondary-btn" title="Modo repetición"><i class="fas fa-redo"></i></button>
          <button id="volumeBtn" class="player-btn secondary-btn" title="Volumen"><i class="fas fa-volume-up"></i></button>
          <input type="range" id="volumeSlider" min="0" max="100" value="80" class="volume-slider" title="Volumen">
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
  <script src="/js/player-global.js"></script>
  <script src="/js/beat-player-integration.js"></script>
</body>
</html>
